services:
  - type: web
    name: uber-booking-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: UBER_CLIENT_ID
        sync: false
      - key: UBER_CLIENT_SECRET
        sync: false
      - key: UBER_REDIRECT_URI
        sync: false
      - key: UBER_ENV
        value: sandbox
